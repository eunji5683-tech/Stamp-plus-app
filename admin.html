  <script>
    /* ==========================================================================
       ★★★ 고치는 곳은 여기 한곳에 모아 두었어요 ★★★
       이 파일의 다른 곳은 건드리지 않아도 돼요.

       ⚠️ 이 화면은 가게 직원만 쓰는 화면이에요. 손님에게 주소를 알려주지 마세요.
       ========================================================================== */

    // ───────────── 구글 시트 주소 (가장 중요!) ─────────────
    // 구글 시트에서 '웹 앱으로 배포'를 하면 나오는 긴 주소를 따옴표 안에 붙여 넣으세요.
    //   예) "https://script.google.com/macros/s/XXXXXXXX/exec"
    // ▶ 주소를 넣으면: 스탬프가 구글 시트에 저장돼요. (새로고침해도, 다른 기기에서도 그대로!)
    //   이때 관리자 비밀번호는 '구글 시트 쪽'에 적어 둔 번호예요. (아래 ADMIN_PIN 은 안 쓰여요)
    // ▶ 비워 두면(""): 지금 쓰는 이 기기 안에만 저장해요. (연습용)
    const SHEET_URL = "";

    // ───────────── 관리자 비밀번호 (숫자 4자리) - '이 기기에만 저장'하는 연습용일 때만 쓰여요 ─────────────
    // 구글 시트를 쓸 때는 이 번호가 아니라, 구글 시트 '스크립트 속성'의 ADMIN_PIN 을 써요.
    const ADMIN_PIN = "7531";

    // 가게 이름 / 스탬프 목표 개수 / 보상 이름
    // ※ 손님 화면(index.html)과 구글 시트 프로그램(apps-script.gs)의 같은 설정과 똑같이 맞춰 주세요.
    const SHOP_NAME = "풀문지카페";
    const STAMP_GOAL = 10;
    const REWARD = "무료 음료";

    // 같은 손님에게 이 시간(초) 안에 또 적립하려고 하면 "방금 적립했습니다. 계속할까요?" 하고 물어요.
    // 60 = 1분. 원하는 숫자로 바꿔도 돼요. (0 으로 하면 묻지 않아요)
    const DUPLICATE_SECONDS = 60;

    // ('이 기기에만 저장'일 때) 스탬프 기록이 저장되는 이름표. 손님 화면과 똑같아야 해요. 바꾸지 마세요!
    const STORAGE_KEY = "fullmoon-stamps-v1";

    // ('이 기기에만 저장'일 때) '오늘 적립 횟수'가 저장되는 이름표 (바꾸지 않아도 돼요)
    const TODAY_KEY = "fullmoon-today-v1";

    // ('이 기기에만 저장'일 때) 마지막으로 백업한 날을 기억하는 이름표 (바꾸지 않아도 돼요)
    const BACKUP_KEY = "fullmoon-last-backup-v1";

    // 마지막 백업 후 이 일수가 지나면 화면 위에 "백업하세요" 안내가 떠요. (7 = 일주일)
    const BACKUP_REMIND_DAYS = 7;
  </script>

  <style>

    /* 현재 개수 보여주는 곳 */
    .status { text-align: center; min-height: 120px; }

    /* 알림 (10개 되면) */

    .today { text-align: center; font-size: 20px; }

    /* 잠금 화면 */

    #app.show { display: block; }

    .keep .info { margin-top: 6px; opacity: 0.8; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn.small { min-height: 60px; font-size: 19px; border-radius: 18px; }

    .link-btn {
      display: block;

    }
    .banner {

    @media (prefers-reduced-motion: reduce) { .alert { animation: none; } }

      <div class="top">

      </div>

      <!-- 백업한 지 오래됐을 때만 나타나는 안내 -->

        <details>

            <li><b>"홈 화면에 추가"</b>를 눌러요.</li>
            <li>앞으로는 <b>그 아이콘으로만</b> 열어요. 사파리와 홈 화면 아이콘은 저장 칸이 따로라서, 섞어 쓰면 기록이 안 보일 수 있어요.</li>

        <!-- 손님 확인 화면도 이 안에서 열어요 (홈 화면 아이콘을 하나만 쓰기 위해서예요) -->

  <script>
    /* ===== 여기서부터는 화면을 움직이는 부분이에요 =====
       고칠 것은 파일 맨 위의 '★ 고치는 곳'에 모아 두었어요. 아래는 건드리지 마세요. */

    const $ = id => document.getElementById(id);
    const USE_SHEET = !!SHEET_URL;                  // 구글 시트를 쓰는지
    const SESSION_KEY = "fullmoon-admin-ok";        // ('이 기기에만 저장'일 때) 들어와 있는 표시
    const PIN_KEY = "fullmoon-admin-pin";           // (구글 시트일 때) 창을 닫을 때까지만 기억하는 비밀번호

    $("loginTitle").textContent = SHOP_NAME + " 관리자";
    $("appTitle").innerHTML = "";
    $("appTitle").append(SHOP_NAME, Object.assign(document.createElement("small"), { textContent: "관리자" }));
    document.title = SHOP_NAME + " 관리자";
    $("alertText").textContent = REWARD + " 제공 대상입니다";

    /* ==========================================================================
       A. '이 기기에만 저장' 방식 (SHEET_URL 을 비워 둘 때)
       ========================================================================== */
    const hasKey = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

    function loadData() {
      try {
        const t = localStorage.getItem(STORAGE_KEY);
        const o = t ? JSON.parse(t) : {};
        return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
      } catch (e) { return {}; }
    }
    function saveData(o) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(o)); return true; }
      catch (e) { return false; }
    }
    function clamp(n) {
      n = Math.floor(Number(n));
      return n > 0 ? Math.min(n, STAMP_GOAL) : 0;
    }
    function getCount(num) {
      const d = loadData();
      return hasKey(d, num) ? clamp(d[num]) : 0;
    }
    function setCount(num, n) {
      const d = loadData();
      d[num] = clamp(n);
      return saveData(d);
    }
    function todayStr() {
      const d = new Date();
      const p = v => String(v).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
    function getToday() {
      try {
        const o = JSON.parse(localStorage.getItem(TODAY_KEY) || "null");
        if (o && o.date === todayStr() && Number.isInteger(o.count) && o.count > 0) return o.count;
      } catch (e) {}
      return 0;   // 날짜가 바뀌었으면 0부터 다시
    }
    function addToday(delta) {
      const n = Math.max(0, getToday() + delta);
      try { localStorage.setItem(TODAY_KEY, JSON.stringify({ date: todayStr(), count: n })); } catch (e) {}
      return n;
    }

    /* ==========================================================================
       B. '구글 시트' 방식 (SHEET_URL 에 주소를 넣었을 때)
       ========================================================================== */
    let adminPin = "";   // 구글 시트 쪽으로 보낼 비밀번호 (이 창을 닫으면 사라져요)

    async function sheetPost(body) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);   // 20초 안에 답이 없으면 포기
      try {
        const res = await fetch(SHEET_URL, {
          method: "POST",
          body: JSON.stringify(Object.assign({ pin: adminPin }, body)),
          signal: ctrl.signal
        });
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    /* ==========================================================================
       C. 두 방식을 같은 모양으로 쓰게 해 주는 부분
          (모두 { ok: true/false, count, today, error } 모양으로 답해요)
       ========================================================================== */
    const store = {
      async login(pin) {
        if (USE_SHEET) {
          adminPin = pin;
          const r = await sheetPost({ action: "login" });
          if (!r.ok) adminPin = "";
          return r;
        }
        return pin === ADMIN_PIN ? { ok: true } : { ok: false, error: "bad_pin" };
      },
      async status(num) {
        if (USE_SHEET) return sheetPost({ action: "status", num });
        return { ok: true, count: getCount(num), today: getToday() };
      },
      async add(num) {
        if (USE_SHEET) return sheetPost({ action: "add", num });
        const n = getCount(num);
        if (n >= STAMP_GOAL) return { ok: false, error: "full", count: n, today: getToday() };
        if (!setCount(num, n + 1)) return { ok: false, error: "save_failed" };
        return { ok: true, count: n + 1, today: addToday(+1) };
      },
      async cancel(num) {
        if (USE_SHEET) return sheetPost({ action: "cancel", num });
        const n = getCount(num);
        if (n <= 0) return { ok: false, error: "empty", count: n, today: getToday() };
        if (!setCount(num, n - 1)) return { ok: false, error: "save_failed" };
        return { ok: true, count: n - 1, today: addToday(-1) };
      },
      async done(num) {
        if (USE_SHEET) return sheetPost({ action: "done", num });
        const n = getCount(num);
        if (n < STAMP_GOAL) return { ok: false, error: "not_full", count: n, today: getToday() };
        if (!setCount(num, 0)) return { ok: false, error: "save_failed" };
        return { ok: true, count: 0, today: getToday() };
      }
    };

    // 문제가 생겼을 때 사장님이 알아듣게 풀어서 알려줘요
    function errorText(code) {
      switch (code) {
        case "bad_pin": return "비밀번호가 맞지 않아요.";
        case "locked": return "비밀번호를 여러 번 틀려서 잠시 막혔어요. 1분 뒤에 다시 해 주세요.";
        case "no_pin_set": return "구글 시트에 비밀번호(ADMIN_PIN)가 아직 없어요. 설정을 확인해 주세요.";
        case "full": return "이미 다 모았어요. '사용 완료'를 눌러 주세요.";
        case "empty": return "뺄 스탬프가 없어요.";
        case "not_full": return "아직 다 모으지 않았어요.";
        case "busy": return "지금 사람이 많아요. 잠시 뒤에 다시 눌러 주세요.";
        case "save_failed": return "저장에 실패했어요. 다시 눌러 주세요.";
        default: return "문제가 생겼어요. 다시 눌러 주세요.";
      }
    }
    const NET_ERROR = "연결이 안 돼요. 인터넷을 확인하고 다시 눌러 주세요. (적립이 안 된 상태예요)";

    /* ==========================================================================
       D. 비밀번호 / 잠금
       ========================================================================== */
    let fails = 0, lockedUntil = 0;   // ('이 기기에만 저장'일 때) 틀린 횟수와 잠금

    function say(text, bad) {
      $("msg").textContent = text;
      $("msg").classList.toggle("bad", !!bad);
    }

    function openApp() {
      $("login").style.display = "none";
      $("app").classList.add("show");
      $("numInput").focus();
      refresh();
      showTodayOnly();     // 들어오자마자 '오늘 적립 횟수'를 보여줘요
      setupKeep();         // 기록 보관(백업) 화면 준비
      if (!USE_SHEET && !saveData(loadData())) say("이 기기에서는 저장이 안 돼요. (사생활 보호 모드를 꺼 주세요)", true);
    }

    function lockApp() {
      try { sessionStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(PIN_KEY); } catch (e) {}
      adminPin = "";
      seq++;
      $("app").classList.remove("show");
      $("login").style.display = "";
      $("pinInput").value = "";
      $("numInput").value = "";
      clearView();
      say("", false);
      $("pinInput").focus();
    }

    async function tryLogin() {
      if (busy) return;
      const pin = $("pinInput").value;
      const now = Date.now();
      if (!USE_SHEET && now < lockedUntil) {
        $("pinError").textContent = Math.ceil((lockedUntil - now) / 1000) + "초 뒤에 다시 해 주세요.";
        return;
      }
      if (pin.length !== 4) { $("pinError").textContent = "비밀번호 4자리를 입력해 주세요."; return; }

      busy = true;
      $("pinError").textContent = USE_SHEET ? "확인 중…" : "";
      let r;
      try {
        r = await store.login(pin);
      } catch (e) {
        busy = false;
        $("pinError").textContent = NET_ERROR;
        return;
      }
      busy = false;
      $("pinInput").value = "";

      if (r.ok) {
        fails = 0;
        $("pinError").textContent = "";
        try {
          if (USE_SHEET) sessionStorage.setItem(PIN_KEY, pin);
          else sessionStorage.setItem(SESSION_KEY, "1");
        } catch (e) {}
        openApp();
      } else if (USE_SHEET) {
        $("pinError").textContent = errorText(r.error);    // 틀린 횟수는 구글 시트 쪽에서 세요
      } else {
        fails++;
        if (fails >= 5) {
          lockedUntil = Date.now() + 30000;   // 5번 틀리면 30초 잠금
          fails = 0;
          $("pinError").textContent = "5번 틀렸어요. 30초 뒤에 다시 해 주세요.";
        } else {
          $("pinError").textContent = errorText(r.error);
        }
      }
    }

    $("pinInput").addEventListener("input", () => {
      $("pinInput").value = $("pinInput").value.replace(/\D/g, "").slice(0, 4);
      $("pinError").textContent = "";
    });
    $("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
    $("pinBtn").addEventListener("click", tryLogin);
    $("lockBtn").addEventListener("click", lockApp);

    /* ==========================================================================
       E. 화면 그리기
       ========================================================================== */
    let busy = false;   // 구글 시트에 부탁하는 중이면 true (그동안 버튼은 잠겨요)
    let seq = 0;        // 오래된 답이 늦게 도착해도 화면이 꼬이지 않게 번호표를 붙여요

    function setButtons(add, cancel, done) {
      $("addBtn").disabled = add;
      $("cancelBtn").disabled = cancel;
      $("doneBtn").disabled = done;
    }

    function clearView() {
      $("who").textContent = "손님 번호를 넣어 주세요";
      $("num").textContent = "";
      $("num").classList.remove("loading");
      $("dots").innerHTML = "";
      $("alertBox").classList.remove("show");
      setButtons(true, true, true);
    }

    function showToday(n) {
      if (typeof n === "number") $("todayCount").textContent = n;
    }

    function render(num, n) {
      $("who").textContent = num + " 손님";
      $("num").classList.remove("loading");
      $("num").innerHTML = n + " <small>/ " + STAMP_GOAL + "개</small>";
      const dots = $("dots");
      dots.innerHTML = "";
      for (let i = 1; i <= STAMP_GOAL; i++) {
        const d = document.createElement("span");
        d.className = "dot" + (i <= n ? " on" : "");
        dots.appendChild(d);
      }
      const full = n >= STAMP_GOAL;
      $("alertBox").classList.toggle("show", full);
      setButtons(full, n <= 0, !full);   // 10개가 되면 더 못 찍고, '사용 완료'는 10개일 때만 눌려요
    }

    // 지금 입력된 번호를 보고 화면(숫자, 동그라미, 버튼 상태)을 새로 그려요
    async function refresh() {
      const num = $("numInput").value;
      const my = ++seq;
      if (num.length !== 4) { clearView(); return; }

      $("who").textContent = num + " 손님";
      $("num").classList.add("loading");
      $("num").textContent = "불러오는 중…";
      $("dots").innerHTML = "";
      $("alertBox").classList.remove("show");
      setButtons(true, true, true);

      try {
        const r = await store.status(num);
        if (my !== seq) return;
        if (!r.ok) { clearView(); handleFail(r); return; }
        render(num, r.count);
        showToday(r.today);
      } catch (e) {
        if (my !== seq) return;
        clearView();
        say(NET_ERROR, true);
      }
    }

    // 번호가 없을 때도 '오늘 적립 횟수'는 보이게 새로 읽어와요
    async function showTodayOnly() {
      if (USE_SHEET) {
        // 구글 시트: 아무 번호로 '오늘 횟수'만 물어봐요 (손님 번호는 아니에요)
        try {
          const r = await store.status("0000");
          if (r.ok) showToday(r.today);
        } catch (e) {}
      } else {
        showToday(getToday());
      }
    }

    // 비밀번호가 바뀌었거나 잠긴 경우는 다시 로그인하게 해요
    function handleFail(r) {
      if (r.error === "bad_pin" || r.error === "locked" || r.error === "no_pin_set") {
        lockApp();
        $("pinError").textContent = errorText(r.error);
      } else {
        say(errorText(r.error), true);
      }
    }

    // 번호를 넣으면 현재 개수가 바로 보여요
    $("numInput").addEventListener("input", () => {
      $("numInput").value = $("numInput").value.replace(/\D/g, "").slice(0, 4);
      say("", false);
      refresh();
    });
    // 칸을 누르면 번호가 전부 선택돼서, 다음 손님 번호를 바로 덮어쓸 수 있어요
    $("numInput").addEventListener("focus", () => $("numInput").select());
    // 엔터 키로는 아무것도 적립되지 않아요 (실수로 눌러도 안전해요)
    $("numInput").addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });

    /* ==========================================================================
       F. 적립 / 취소 / 사용 완료
       ========================================================================== */
    // 방금 적립한 시각 기억 (번호 → 시각). 화면을 닫거나 새로고침하면 사라져요. 어디에도 저장하지 않아요.
    const lastAdd = {};

    // 버튼을 눌렀을 때 하는 일. 구글 시트에 부탁하는 동안에는 버튼이 잠겨서 두 번 눌려도 한 번만 처리돼요.
    async function run(kind, okText) {
      const num = $("numInput").value;
      if (num.length !== 4 || busy) return;       // 번호가 4자리가 아니면 아무 일도 안 해요
      busy = true;
      setButtons(true, true, true);
      say("처리하는 중…", false);
      let r;
      try {
        r = await store[kind](num);
      } catch (e) {
        busy = false;
        say(NET_ERROR, true);
        refresh();
        return;
      }
      busy = false;

      if (!r.ok) {
        handleFail(r);
        if (typeof r.count === "number" && $("numInput").value === num) render(num, r.count);
        else refresh();
        return;
      }

      if (kind === "add") lastAdd[num] = Date.now();
      if (kind === "cancel") delete lastAdd[num];    // 실수를 고친 뒤에 다시 적립할 때는 묻지 않아요
      showToday(r.today);
      updateKeepInfo();    // 손님 수가 바뀌었을 수 있어서 보관 정보도 새로 보여줘요

      if ($("numInput").value === num) {
        render(num, r.count);
        say(typeof okText === "function" ? okText(r.count) : okText, false);
        if (kind === "add" && r.count >= STAMP_GOAL && navigator.vibrate) { try { navigator.vibrate(200); } catch (e) {} }
      } else {
        refresh();    // 처리하는 동안 다른 번호를 넣었으면 그 번호 화면으로
      }
    }

    $("addBtn").addEventListener("click", () => {
      const num = $("numInput").value;
      if (num.length !== 4 || busy) return;
      // 같은 손님에게 1분(DUPLICATE_SECONDS) 안에 또 적립하면 한 번 물어봐요
      const prev = lastAdd[num];
      if (DUPLICATE_SECONDS > 0 && prev && Date.now() - prev < DUPLICATE_SECONDS * 1000) {
        if (!confirm("방금 적립했습니다. 계속할까요?")) return;
      }
      run("add", c => c >= STAMP_GOAL ? "10개 완성!" : "적립했어요 ✓");
    });

    $("cancelBtn").addEventListener("click", () => run("cancel", "1개 뺐어요"));

    $("doneBtn").addEventListener("click", () => {
      const num = $("numInput").value;
      if (num.length !== 4 || busy) return;
      // 되돌릴 수 없어서 이 버튼에는 확인 창이 두 번 떠요
      if (!confirm(num + " 손님의 " + REWARD + "를 드렸나요?")) return;
      if (!confirm("정말 0개로 되돌릴까요?\n되돌릴 수 없어요.")) return;
      run("done", "0개로 되돌렸어요");
    });

    /* ==========================================================================
       H. 기록 보관 (백업) - '이 기기에만 저장'일 때만 쓰여요
          기록이 이 휴대폰 안에만 있어서, 휴대폰을 바꾸거나 인터넷 기록을 지우면 사라질 수 있어요.
          그래서 가끔 '백업 내려받기'로 파일을 따로 보관해 두세요.
       ========================================================================== */
    function keepSay(text, bad) {
      $("keepMsg").textContent = text;
      $("keepMsg").classList.toggle("bad", !!bad);
    }

    function setupKeep() {
      if (USE_SHEET) { $("keepCard").style.display = "none"; return; }
      updateKeepInfo();
    }

    function getLastBackup() {
      try { return Number(localStorage.getItem(BACKUP_KEY)) || 0; } catch (e) { return 0; }
    }

    function updateKeepInfo() {
      if (USE_SHEET) return;
      const n = Object.keys(loadData()).length;
      const canSave = saveData(loadData());          // 저장이 되는지 한 번 시험해 봐요
      const st = $("saveStatus");
      st.className = canSave ? "ok" : "bad";
      st.textContent = canSave
        ? "✓ 이 기기에 저장 중이에요 (기록된 손님 " + n + "명)"
        : "⚠️ 저장이 안 되고 있어요. 시크릿(사생활 보호) 창이면 끄고 다시 열어 주세요.";

      const last = getLastBackup();
      const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
      $("backupInfo").textContent = !last ? "아직 백업한 적이 없어요."
        : (days === 0 ? "마지막 백업: 오늘" : "마지막 백업: " + days + "일 전");

      // 손님 기록이 있는데 백업한 지 오래됐으면 화면 위에 안내가 떠요
      const need = n > 0 && (!last || days >= BACKUP_REMIND_DAYS);
      const banner = $("backupBanner");
      banner.classList.toggle("show", need);
      banner.textContent = !last
        ? "아직 백업을 안 했어요. 아래 '기록 보관'에서 '백업 내려받기'를 눌러 주세요."
        : "백업한 지 " + days + "일이 지났어요. 아래 '기록 보관'에서 '백업 내려받기'를 눌러 주세요.";
    }

    function markBackup() {
      try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) {}
      updateKeepInfo();
    }

    async function doBackup() {
      const text = JSON.stringify({ shop: SHOP_NAME, savedAt: todayStr(), data: loadData() }, null, 2);
      const name = SHOP_NAME + "-스탬프백업-" + todayStr() + ".json";

      // 아이폰: 공유 창이 떠서 '파일에 저장'을 고를 수 있어요
      try {
        const file = new File([text], name, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          markBackup();
          keepSay("백업했어요. '파일에 저장'을 고르셨는지 확인하세요.", false);
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") { keepSay("백업을 취소했어요.", false); return; }
      }

      // 공유 창을 못 쓰는 기기: 파일로 내려받아요
      try {
        const blob = new Blob([text], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        markBackup();
        keepSay("백업 파일을 내려받았어요. 안전한 곳에 보관하세요.", false);
      } catch (e) {
        keepSay("백업을 만들지 못했어요. 다시 눌러 주세요.", true);
      }
    }

    function doRestore(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const obj = JSON.parse(reader.result);
          const src = obj && obj.data;
          if (!src || typeof src !== "object" || Array.isArray(src)) throw new Error("모양이 달라요");
          const clean = {};
          for (const key of Object.keys(src)) {
            if (/^\d{4}$/.test(key)) clean[key] = clamp(src[key]);     // 4자리 숫자 번호만 받아요
          }
          const howMany = Object.keys(clean).length;
          if (!confirm("백업 파일의 손님 " + howMany + "명 기록으로 바꿀까요?\n(지금 저장된 기록은 사라져요)")) return;
          if (!saveData(clean)) throw new Error("저장 실패");
          keepSay("백업을 불러왔어요. (" + howMany + "명)", false);
          updateKeepInfo();
          refresh();
        } catch (e) {
          keepSay("백업 파일을 읽을 수 없어요. 맞는 파일인지 확인해 주세요.", true);
        }
      };
      reader.onerror = () => keepSay("파일을 읽지 못했어요.", true);
      reader.readAsText(file);
    }

    $("backupBtn").addEventListener("click", doBackup);
    $("restoreBtn").addEventListener("click", () => $("restoreFile").click());
    $("restoreFile").addEventListener("change", () => {
      const f = $("restoreFile").files[0];
      $("restoreFile").value = "";
      if (f) doRestore(f);
    });

    /* ==========================================================================
       G. 처음 열 때
       ========================================================================== */
    (async function start() {
      let saved = "";
      try { saved = USE_SHEET ? (sessionStorage.getItem(PIN_KEY) || "") : (sessionStorage.getItem(SESSION_KEY) === "1" ? "1" : ""); } catch (e) {}

      if (!saved) { $("pinInput").focus(); return; }

      // 이미 들어와 있던 창이면(새로고침) 비밀번호를 다시 묻지 않아요
      if (!USE_SHEET) { openApp(); return; }
      $("pinError").textContent = "확인 중…";
      try {
        adminPin = saved;
        const r = await sheetPost({ action: "login" });
        if (r.ok) { $("pinError").textContent = ""; openApp(); return; }
      } catch (e) {
        $("pinError").textContent = NET_ERROR;
        adminPin = "";
        return;
      }
      adminPin = "";
      try { sessionStorage.removeItem(PIN_KEY); } catch (e) {}
      $("pinError").textContent = "";
      $("pinInput").focus();
    })();
  </script>
</body>
</html>
